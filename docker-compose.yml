services:
  app:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        mkdir -p /www
        printf '<!doctype html><title>Lumo Compose Test</title><h1>%s</h1><p>%s</p>\n' "$${LUMO_INSTANCE_ID:-test}" "$${LUMO_DOMAIN:-localhost}" > /www/index.html
        httpd -f -p 8080 -h /www
    environment:
      LUMO_INSTANCE_ID: ${LUMO_INSTANCE_ID:-test}
      LUMO_DOMAIN: ${LUMO_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:${PORT:-18080}:8080"
